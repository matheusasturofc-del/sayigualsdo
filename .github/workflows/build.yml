name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: sayigualsdo
          path: build/libs/*.jar
      # Publica o .jar na página "Releases" para baixar com um clique.
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download
          name: SayIgual (download)
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Baixe o arquivo **sayigualsdo-...+1.21.1.jar** abaixo (não o `-sources`) e coloque na pasta `mods`.
            Precisa de Fabric 1.21.1, Fabric API e Simple Voice Chat.

            Commit: ${{ github.sha }}
          files: |
            build/libs/sayigualsdo-*+1.21.1.jar
          fail_on_unmatched_files: true
